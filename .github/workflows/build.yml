name: Build APK and IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_ID: com.hanhtrinhanhhung.game
  APP_NAME: Hành Trình Anh Hùng

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tạo project Capacitor
        run: |
          mkdir www && cp index.html www/index.html
          python3 - <<'PY'
          import re
          p = "www/index.html"
          s = open(p, encoding="utf8").read()
          # 1) chặn bôi đen chữ / menu giữ-chạm của iOS
          css = "<style>*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}</style>"
          assert "</head>" in s
          s = s.replace("</head>", css + "</head>", 1)
          # 2) xuất 2 bản nhạc nhúng base64 ra file mp3 thật: HTML nhẹ đi ~6MB, không còn giải mã trên luồng chính
          import base64
          old = ('const b64=document.getElementById("mp3-"+k).textContent.trim(),bin=atob(b64),u8=new Uint8Array(bin.length);\n'
                 '    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);\n'
                 '    const a=new Audio(URL.createObjectURL(new Blob([u8],{type:"audio/mpeg"})));')
          new = 'const a=new Audio("mp3-"+k+".mp3");'
          if old in s:
              def grab(m):
                  open("www/mp3-" + m.group(1) + ".mp3", "wb").write(base64.b64decode(m.group(2).strip()))
                  return '<script type="text/plain" id="mp3-' + m.group(1) + '"></script>'
              s, n = re.subn(r'<script type="text/plain" id="mp3-(\w+)">([^<]*)</script>', grab, s)
              s = s.replace(old, new, 1)
              print("Da xuat", n, "file nhac")
          else:
              print("CANH BAO: khong tim thay doan giai ma nhac, giu nguyen")
          open(p, "w", encoding="utf8").write(s)
          PY
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          printf '{"appId":"%s","appName":"%s","webDir":"www","ios":{"scrollEnabled":false,"contentInset":"never"}}' "$APP_ID" "$APP_NAME" > capacitor.config.json
          npx cap add android
          sed -i 's/android:name="\.MainActivity"/& android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          # Toàn màn hình thật sự: ẩn thanh trạng thái + thanh điều hướng, vẽ tràn cả vùng lỗ camera
          MA="android/app/src/main/java/$(echo "$APP_ID" | tr . /)/MainActivity.java"
          test -f "$MA" || { echo "Không thấy $MA"; exit 1; }
          cat > "$MA" <<JAVA
          package $APP_ID;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try { getBridge().getWebView().addJavascriptInterface(new SaveBridge(), "HtahNative"); } catch (Exception e) {}
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              hideSystemBars();
            }

            /* Cầu nối cho game (JS): lưu file save thẳng vào thư mục Tải xuống */
            public class SaveBridge {
              @JavascriptInterface
              public String saveFile(String name, String text) {
                try {
                  byte[] data = text.getBytes(StandardCharsets.UTF_8);
                  if (Build.VERSION.SDK_INT >= 29) {
                    ContentValues v = new ContentValues();
                    v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                    v.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                    v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                    Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                    if (uri == null) return "";
                    OutputStream os = getContentResolver().openOutputStream(uri);
                    if (os == null) return "";
                    os.write(data);
                    os.close();
                    return "Download/" + name;
                  } else {
                    File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                    if (dir == null) return "";
                    dir.mkdirs();
                    File f = new File(dir, name);
                    FileOutputStream os = new FileOutputStream(f);
                    os.write(data);
                    os.close();
                    return f.getAbsolutePath();
                  }
                } catch (Exception e) {
                  return "";
                }
              }
            }

            @Override
            public void onPause() {
              try { getBridge().getWebView().evaluateJavascript("window.dispatchEvent(new Event('htah-bg'))", null); } catch (Exception e) {}
              super.onPause();
            }

            @Override
            public void onResume() {
              super.onResume();
              try { getBridge().getWebView().evaluateJavascript("window.dispatchEvent(new Event('htah-fg'))", null); } catch (Exception e) {}
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideSystemBars();
            }

            @SuppressWarnings("deprecation")
            private void hideSystemBars() {
              getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }
          }
          JAVA
          npx cap sync android
      - name: Gắn icon
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          import os, glob, shutil
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          for f in glob.glob(res + "/**/ic_launcher*", recursive=True):
              if os.path.isfile(f):
                  os.remove(f)
          m = Image.open("icon.png").convert("RGB")
          for d, px in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              os.makedirs(f"{res}/mipmap-{d}", exist_ok=True)
              im = m.resize((px, px), Image.LANCZOS)
              im.save(f"{res}/mipmap-{d}/ic_launcher.png")
              im.save(f"{res}/mipmap-{d}/ic_launcher_round.png")
          PY
      - name: Dùng khóa ký cố định (để cài đè được bản cũ)
        run: |
          test -f debug.keystore || { echo "Thiếu debug.keystore trong repo"; exit 1; }
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          grep -q "versionCode 1" android/app/build.gradle || { echo "Không thấy versionCode 1"; exit 1; }
          sed -i "s/versionCode 1/versionCode $(date +%s)/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tạo project Capacitor
        run: |
          mkdir www && cp index.html www/index.html
          python3 - <<'PY'
          import re
          p = "www/index.html"
          s = open(p, encoding="utf8").read()
          # 1) chặn bôi đen chữ / menu giữ-chạm của iOS
          css = "<style>*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}</style>"
          assert "</head>" in s
          s = s.replace("</head>", css + "</head>", 1)
          # 2) xuất 2 bản nhạc nhúng base64 ra file mp3 thật: HTML nhẹ đi ~6MB, không còn giải mã trên luồng chính
          import base64
          old = ('const b64=document.getElementById("mp3-"+k).textContent.trim(),bin=atob(b64),u8=new Uint8Array(bin.length);\n'
                 '    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);\n'
                 '    const a=new Audio(URL.createObjectURL(new Blob([u8],{type:"audio/mpeg"})));')
          new = 'const a=new Audio("mp3-"+k+".mp3");'
          if old in s:
              def grab(m):
                  open("www/mp3-" + m.group(1) + ".mp3", "wb").write(base64.b64decode(m.group(2).strip()))
                  return '<script type="text/plain" id="mp3-' + m.group(1) + '"></script>'
              s, n = re.subn(r'<script type="text/plain" id="mp3-(\w+)">([^<]*)</script>', grab, s)
              s = s.replace(old, new, 1)
              print("Da xuat", n, "file nhac")
          else:
              print("CANH BAO: khong tim thay doan giai ma nhac, giu nguyen")
          open(p, "w", encoding="utf8").write(s)
          PY
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          printf '{"appId":"%s","appName":"%s","webDir":"www","ios":{"scrollEnabled":false,"contentInset":"never"}}' "$APP_ID" "$APP_NAME" > capacitor.config.json
          npx cap add ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          npx cap sync ios
      - name: Gắn icon
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 -c "from PIL import Image; Image.open('icon.png').convert('RGB').resize((1024,1024), Image.LANCZOS).save('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png')"
      - name: Build app chưa ký
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Đóng gói IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr game-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: game-unsigned.ipa
